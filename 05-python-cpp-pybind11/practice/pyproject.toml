[build-system]
requires = ["scikit-build-core==1.1.1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "py-cpp-pybind11-add"
version = "0.1.0"
description = "Learn to call a C++ add function from Python with pybind11"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0"]

[tool.scikit-build]
minimum-version = "1.1"
cmake.build-type = "Release"
ninja.version = "==1.13.2"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/cpp_add"]
sdist.inclusion-mode = "explicit"
sdist.include = [
    "pyproject.toml",
    ".python-version",
    "uv.lock",
    "README.md",
    "CMakeLists.txt",
    "native/*.hpp",
    "native/*.cpp",
    "src/cpp_add/*.py",
    "src/cpp_add/*.pyi",
    "src/cpp_add/py.typed",
    "tests/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv-wheel"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
